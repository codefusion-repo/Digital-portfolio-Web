# This is a basic example Blueprint for a Django web service and
# the PostgreSQL database it connects to.
services:
  - type: web # A Python web service named django-app running on a free instance
    plan: free
    name: backend
    runtime: python
    repo: https://github.com/codefusion-repo/Digital-portfolio-Web-backend.git
    buildCommand: "./render/build.sh"
    startCommand: "uvicorn core.asgi:application --host 0.0.0.0"

  - type: web # A Python web service named django-app running on a free instance
    plan: free
    name: frontend
    runtime: node
    repo: https://github.com/codefusion-repo/Digital-portfolio-Web-frontend.git
    buildCommand: "npm install --legacy-peer-deps"
    startCommand: "npm start"
